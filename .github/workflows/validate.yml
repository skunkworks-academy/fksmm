name: Validate Fernanda IDR
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Stage downloadable IDR PDF
        run: |
          mkdir -p static/idr
          cp idr/Fernanda_Koppe_Souto_Maior_Macias_IDR.pdf static/idr/Fernanda_Koppe_Souto_Maior_Macias_IDR.pdf
      - run: npm run validate
      - run: npm run build
      - name: Verify generated output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/CNAME
          grep -Fxq 'fksmm.skunkworksacademy.com' build/CNAME
          test -s build/img/favicon-black.svg
          test -s build/img/favicon-white.svg
          test -s build/idr/Fernanda_Koppe_Souto_Maior_Macias_IDR.pdf
          test -s build/downloads/fernanda-idr-12-week-calendar.ics
          test -s build/idr/12-week-sprint.html || test -s build/idr/12-week-sprint/index.html
          while IFS= read -r page; do
            grep -Fq '/img/favicon-black.svg' "$page"
            grep -Fq '/img/favicon-white.svg' "$page"
            ! grep -Fq 'fernandasmmacias@hotmail.com' "$page"
          done < <(find build -type f -name '*.html' -print)
